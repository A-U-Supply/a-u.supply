name: AI triage new issues

on:
  issues:
    types: [opened]

permissions:
  issues: write
  models: read
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const triage = require('./.github/scripts/triage-issue.js');
            await triage({ github, context, core, issue: context.payload.issue });
