name: AI triage new issues

on:
  issues:
    types: [opened]

permissions:
  issues: write
  models: read
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const triage = require('./.github/scripts/triage-issue.js');
            const issue = context.payload.issue;
            const hasLabels = Array.isArray(issue.labels) && issue.labels.length > 0;
            await triage({
              github,
              context,
              core,
              issue,
              rewriteBody: !hasLabels,
            });
