name: PR preview environment

# Opt-in via the `preview` label. Adding the label provisions a preview; pushing
# to a labeled PR updates it; removing the label or closing the PR tears it
# down. Without the label, this workflow does nothing -- no build minutes, no
# host load.

on:
  pull_request:
    types: [labeled, unlabeled, synchronize, closed]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/a-u-supply/au-supply-preview
  PREVIEW_LABEL: preview

jobs:
  build:
    if: |
      github.event.pull_request.state == 'open' && (
        (github.event.action == 'labeled' && github.event.label.name == 'preview') ||
        (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'preview'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Compute image tag
        id: tag
        run: echo "tag=${{ env.IMAGE }}:pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=preview
          cache-to: type=gha,mode=max,scope=preview

  deploy:
    needs: build
    if: |
      github.event.pull_request.state == 'open' && (
        (github.event.action == 'labeled' && github.event.label.name == 'preview') ||
        (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'preview'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DOKKU_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 204.168.201.89 >> ~/.ssh/known_hosts
          printf 'Host dokku\n  HostName 204.168.201.89\n  User dokku\n  IdentityFile ~/.ssh/id_ed25519\n' >> ~/.ssh/config

      - name: Provision PR app from pre-built image
        run: |
          chmod +x scripts/dokku-pr-provision.sh
          scripts/dokku-pr-provision.sh \
            "${{ github.event.pull_request.number }}" \
            "${{ needs.build.outputs.image_tag }}"

      - name: Comment preview URL on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-preview
          message: |
            ### Preview environment

            **URL:** https://pr-${{ github.event.pull_request.number }}.dev.a-u.supply

            - Pointed at prod integrations (fold, etc.)
            - User DB snapshotted from prod on first deploy of this PR; subsequent pushes preserve it
            - Worker process disabled in preview
            - Image built on GitHub runners and pulled by Dokku — no build load on the prod host
            - Remove the `preview` label or close the PR to tear it down

  destroy:
    if: |
      (github.event.action == 'unlabeled' && github.event.label.name == 'preview') ||
      (github.event.action == 'closed' && contains(github.event.pull_request.labels.*.name, 'preview'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DOKKU_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 204.168.201.89 >> ~/.ssh/known_hosts
          printf 'Host dokku\n  HostName 204.168.201.89\n  User dokku\n  IdentityFile ~/.ssh/id_ed25519\n' >> ~/.ssh/config

      - name: Destroy PR app
        run: |
          chmod +x scripts/dokku-pr-destroy.sh
          scripts/dokku-pr-destroy.sh "${{ github.event.pull_request.number }}"

      - name: Delete GHCR package versions for this PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=${{ github.event.pull_request.number }}
          # List versions of the preview package, filter to those tagged for this PR,
          # delete each. Best-effort: failures don't fail the workflow.
          gh api --paginate "/orgs/A-U-Supply/packages/container/au-supply-preview/versions" 2>/dev/null \
            | jq -r ".[] | select(.metadata.container.tags // [] | any(startswith(\"pr-${PR}-\"))) | .id" \
            | while read -r vid; do
                echo "deleting GHCR version ${vid}"
                gh api -X DELETE "/orgs/A-U-Supply/packages/container/au-supply-preview/versions/${vid}" || true
              done
          echo "GHCR cleanup complete"

      - name: Update PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-preview
          message: |
            ### Preview environment

            Torn down.
