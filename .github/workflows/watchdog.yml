name: Uptime watchdog

# Checks a-u.supply every 10 minutes. If it's down: captures diagnostics
# (shown in the run log), restarts the app, and falls back to a rebuild.
# The run is marked failed whenever the site was found down, so GitHub
# emails a notification even when the auto-restart fixes it.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Health check
        id: health
        run: |
          for i in 1 2 3; do
            if curl -fsS -m 20 https://a-u.supply/ | grep -q "A-U.SUPPLY"; then
              echo "up=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep 20
          done
          echo "up=false" >> "$GITHUB_OUTPUT"

      - name: Set up SSH
        if: steps.health.outputs.up == 'false'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DOKKU_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 204.168.201.89 >> ~/.ssh/known_hosts
          printf 'Host dokku\n  HostName 204.168.201.89\n  User dokku\n  IdentityFile ~/.ssh/id_ed25519\n' >> ~/.ssh/config

      - name: Capture diagnostics
        if: steps.health.outputs.up == 'false'
        run: |
          for c in "ps:report au-supply" "ps:inspect au-supply" "network:report au-supply" \
                   "proxy:report au-supply" "ports:report au-supply" "nginx:report au-supply" \
                   "nginx:show-config au-supply" "resource:report au-supply" \
                   "logs:failed au-supply" "logs au-supply -p web -n 150" "logs au-supply -p worker -n 50" \
                   "nginx:error-logs au-supply"; do
            echo "::group::$c"; ssh dokku $c 2>&1 | tail -400 || true; echo "::endgroup::"
          done

      - name: Repair
        if: steps.health.outputs.up == 'false'
        shell: bash {0}
        run: |
          up() { sleep 20; curl -fsS -m 20 https://a-u.supply/ | grep -q "A-U.SUPPLY"; }

          ssh dokku ps:set au-supply restart-policy always || true

          # nginx may be stopped (a stopped nginx also makes ps:restart abort
          # on its reload step), so validate + start it before anything else.
          echo "::group::0. validate + start nginx"
          ssh dokku nginx:validate-config 2>&1 || true
          ssh dokku nginx:start 2>&1 || true
          echo "::endgroup::"
          if up; then echo "Recovered after nginx start"; exit 0; fi

          echo "::group::1. restart app"
          ssh dokku ps:restart au-supply 2>&1 || true
          echo "::endgroup::"
          if up; then echo "Recovered after app restart"; exit 0; fi

          # App passes its own healthcheck but nginx still 502s: regenerate
          # the vhost from live container IPs and fully restart nginx.
          echo "::group::2. rebuild proxy config + restart nginx"
          ssh dokku proxy:build-config au-supply || true
          ssh dokku nginx:show-config au-supply | grep -nE "upstream|server [0-9]" || true
          ssh dokku ps:inspect au-supply | grep -E '"IPAddress"|"Name"' || true
          echo "--- validate nginx config"
          ssh dokku nginx:validate-config 2>&1 || true
          ssh dokku nginx:stop || true
          echo "::endgroup::"
          # Never leave nginx stopped: retry start while old workers release :443
          for i in 1 2 3 4 5; do
            echo "--- nginx:start attempt $i"
            ssh dokku nginx:start 2>&1 && break
            sleep 10
          done
          echo "--- validate after start"
          ssh dokku nginx:validate-config 2>&1 || true
          if up; then echo "Recovered after nginx restart"; exit 0; fi

          echo "::group::3. post-repair nginx errors"
          ssh dokku nginx:error-logs au-supply 2>&1 | tail -30 || true
          echo "::endgroup::"
          echo "::error::Still down after app + nginx restart; likely needs host-level fix (systemctl restart docker / reboot)"
          exit 1

      - name: Flag the outage
        if: steps.health.outputs.up == 'false'
        run: |
          echo "::error::a-u.supply was down — see 'Capture diagnostics' for the cause"
          exit 1
