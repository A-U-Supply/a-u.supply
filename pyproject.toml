[project]
name = "au-supply"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.135.3",
    "bcrypt==4.0.1",
    "faster-whisper>=1.1.0",
    "meilisearch>=0.31.0",
    "passlib[bcrypt]>=1.7.4",
    "psycopg2-binary>=2.9.9",
    "easyocr>=1.7.2",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "Pillow>=11.0.0",
    "pillow-heif>=0.18.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.26",
    "scikit-learn>=1.5.0",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.49",
    "uvicorn[standard]>=0.44.0",
    "yt-dlp>=2025.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# onnxruntime 1.20+ dropped Intel Mac (x86_64) wheels — pin to the last
# compatible version for local dev on Intel Macs. Arm Macs and Linux are
# unaffected.
[tool.uv]
constraint-dependencies = [
  "onnxruntime==1.19.2 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

# Force CPU-only PyTorch wheels — EasyOCR depends on torch/torchvision and the
# default PyPI wheels pull in ~2GB of CUDA libraries we'd never use on dokku.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
